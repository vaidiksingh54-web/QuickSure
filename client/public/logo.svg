<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="110" fill="none">
  <defs>
    <!-- Royal Security Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Velocity Gold Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Inner Shield Depth Shimmer -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="shieldShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- BRAND EMBLEM: The Velocity Shield -->
  <g transform="translate(10, 10)" filter="url(#shieldShadow)">
    <!-- Base Armor Crest -->
    <path d="M 44 4 C 68 4, 80 15, 84 32 C 84 64, 48 82, 44 88 C 40 82, 4 64, 4 32 C 8 15, 20 4, 44 4 Z" 
          fill="url(#shieldGrad)" />
    
    <!-- Inset Rim Stroke -->
    <path d="M 44 8 C 65 8, 75 18, 78 32 C 78 59, 48 76, 44 81 C 40 76, 10 59, 10 32 C 13 18, 23 8, 44 8 Z" 
          stroke="url(#glowGrad)" stroke-width="2" fill="none" />

    <!-- Speed Aerodynamic Chevrons (Left Border) -->
    <path d="M 1 42 L 12 42 L 8 49 L -3 49 Z" fill="#F59E0B" opacity="0.9" />
    <path d="M 5 53 L 15 53 L 12 59 L 2 59 Z" fill="#F59E0B" opacity="0.7" />

    <!-- Lightning Bolt & Forward Arrow Hybrid -->
    <path d="M 50 14 L 28 44 L 43 44 L 35 74 L 63 38 L 46 38 Z" 
          fill="url(#boltGrad)" 
          stroke="#FFFFFF" 
          stroke-width="2" 
          stroke-linejoin="round" />
    
    <!-- Verified Security Dot -->
    <circle cx="44" cy="88" r="3" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
  </g>

  <!-- WORDMARK: QuickSure Typography -->
  <g transform="translate(112, 68)">
    <!-- "Quick" in High-Contrast Obsidian Slate -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="42" 
          font-weight="900" 
          letter-spacing="-1.2" 
          fill="#0F172A">
      Quick
    </text>
    
    <!-- "Sure" in Trust Royal Blue -->
    <text x="122" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="42" 
          font-weight="900" 
          letter-spacing="-1.2" 
          fill="#2563EB">
      Sure
    </text>

    <!-- Speed Accent: Amber Voltage Slash over 'Sure' -->
    <path d="M 218 -26 L 230 -26 L 222 -14 L 210 -14 Z" fill="#F59E0B" />

    <!-- Assurance Subtitle Ribbon -->
    <text x="2" y="24" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="11" 
          font-weight="700" 
          letter-spacing="2.2" 
          fill="#64748B">
      EXPRESS DISPATCH <tspan fill="#F59E0B" font-weight="900">•</tspan> 100% VERIFIED
    </text>
  </g>
</svg>
