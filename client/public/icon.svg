<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="200" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="iconShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="iconBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3B82F6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Slate Squircle Container -->
  <rect width="200" height="200" rx="44" fill="url(#iconBg)" />
  <rect x="2" y="2" width="196" height="196" rx="42" stroke="#334155" stroke-width="2" fill="none" />

  <!-- Shield Crest Core -->
  <g transform="translate(40, 32)" filter="url(#iconGlow)">
    <!-- Base Shield -->
    <path d="M 60 8 C 94 8, 112 24, 116 48 C 116 92, 68 118, 60 126 C 52 118, 4 92, 4 48 C 8 24, 26 8, 60 8 Z" 
          fill="url(#iconShield)" />
    
    <!-- Speed Chevrons Left Edge -->
    <path d="M 0 60 L 16 60 L 12 70 L -4 70 Z" fill="#F59E0B" opacity="0.9" />
    <path d="M 4 75 L 18 75 L 14 83 L 0 83 Z" fill="#F59E0B" opacity="0.7" />

    <!-- Lightning Bolt Anchor (Speed + Assurance) -->
    <path d="M 68 24 L 38 66 L 58 66 L 48 108 L 88 58 L 64 58 Z" 
          fill="url(#iconBolt)" 
          stroke="#FFFFFF" 
          stroke-width="2.5" 
          stroke-linejoin="round" />
    
    <!-- Trust Check Dot -->
    <circle cx="60" cy="126" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
  </g>
</svg>
